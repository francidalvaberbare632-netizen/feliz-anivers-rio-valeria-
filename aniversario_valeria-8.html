<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz Aniversário, Valéria! 🎂</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; overflow:hidden;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#ffd6ec,#d8e7ff,#fff1b8);
    display:flex; align-items:center; justify-content:center;
    text-align:center;
  }
  .card{
    position:relative; z-index:2;
    width:min(90%,520px); padding:35px 22px;
    background:rgba(255,255,255,.78); border-radius:30px;
    box-shadow:0 15px 45px rgba(0,0,0,.15);
    backdrop-filter:blur(7px);
  }
  h1{font-size:clamp(34px,10vw,58px); margin:0 0 8px; color:#ff4f9a}
  h2{margin:0 0 18px;color:#7b5cff;font-size:28px}
  #msg{font-size:19px;line-height:1.5;color:#444;min-height:120px}
  .cake{font-size:80px;animation:bounce 1.2s infinite alternate}
  button{
    border:0;border-radius:999px;padding:13px 22px;
    background:#ff5ca8;color:white;font-size:17px;font-weight:bold;
    cursor:pointer;box-shadow:0 7px 15px rgba(255,92,168,.3)
  }
  .balloon{position:absolute;font-size:45px;animation:float 5s ease-in-out infinite}
  .b1{left:4%;top:12%}.b2{right:5%;top:18%;animation-delay:1s}
  .b3{left:10%;bottom:8%;animation-delay:2s}.b4{right:10%;bottom:9%;animation-delay:3s}
  .confetti{position:absolute;inset:0;pointer-events:none}
  .piece{position:absolute;width:9px;height:15px;animation:fall linear infinite}
  @keyframes bounce{to{transform:translateY(-10px)}}
  @keyframes float{50%{transform:translateY(-25px) rotate(7deg)}}
  @keyframes fall{from{transform:translateY(-20vh) rotate(0)}to{transform:translateY(120vh) rotate(720deg)}}
</style>
</head>
<body>
<div class="balloon b1">🎈</div><div class="balloon b2">🎈</div>
<div class="balloon b3">🎈</div><div class="balloon b4">🎈</div>
<div class="confetti" id="confetti"></div>

<div class="card">
  <div class="cake">🎂</div>
  <h1>Feliz aniversário!</h1>
  <h2>Valéria 💖</h2>
  <div id="msg"></div>
  <button onclick="startParty()">🎉 Feliz aniversário, Valéria! 💖</button>
</div>

<script>
const text = `Hoje é um dia muito especial! 🥳💗
Que seus 11 anos sejam cheios de alegria, amizade, diversão e momentos inesquecíveis.
Você merece um dia maravilhoso! 🎁✨
Feliz aniversário, Valéria! 🎂🎈💖`;

let i=0;
function type(){
  if(i<text.length){
    document.getElementById("msg").innerHTML += text[i]==="\n" ? "<br>" : text[i];
    i++; setTimeout(type,28);
  }
}
type();

const box=document.getElementById("confetti");
for(let n=0;n<45;n++){
  const p=document.createElement("div"); p.className="piece";
  p.style.left=Math.random()*100+"%";
  p.style.animationDuration=(3+Math.random()*4)+"s";
  p.style.animationDelay=(-Math.random()*6)+"s";
  p.style.background=`hsl(${Math.random()*360},90%,65%)`;
  box.appendChild(p);
}

let ctx, timer;
function startParty(){
  if(ctx) return;
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  const notes=[523.25,659.25,783.99,1046.5,783.99,659.25];
  let t=ctx.currentTime;
  notes.forEach((f,k)=>{
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.frequency.value=f; o.type="sine";
    g.gain.setValueAtTime(.0001,t+k*.28);
    g.gain.exponentialRampToValueAtTime(.12,t+k*.28+.02);
    g.gain.exponentialRampToValueAtTime(.0001,t+k*.28+.24);
    o.connect(g).connect(ctx.destination); o.start(t+k*.28); o.stop(t+k*.28+.25);
  });
}
</script>
</body>
</html>
